name: AnnaSetu CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ──────────────────────────────────────────
  # LAYER 01 · Donor API (Node.js/Express)
  # ──────────────────────────────────────────
  test-donor-api:
    name: "L01 · Donor API (Node.js)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: layer-01-donor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install
      - name: Health check
        run: |
          node api/server.js &
          sleep 4
          curl -sf http://localhost:3001/health | grep -q "healthy"
          echo "L01 Donor API OK"
          pkill -f "api/server.js" || true

  # ──────────────────────────────────────────
  # LAYER 02 · ONDC Beckn Nodes
  # ──────────────────────────────────────────
  test-ondc:
    name: "L02 · ONDC Beckn Nodes (Node.js)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: layer-02-ondc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install
      - name: Seller Node health + Beckn /search
        run: |
          node seller-node/index.js &
          sleep 4
          curl -sf http://localhost:3002/health | grep -q "healthy"
          curl -sf -X POST http://localhost:3002/search \
            -H "Content-Type: application/json" \
            -d '{"context":{"bap_id":"ngo.test.com","action":"search"},"message":{"intent":{}}}' \
            | grep -q "ACK"
          echo "ONDC Seller OK"
          pkill -f "seller-node" || true
      - name: Buyer Node health check
        run: |
          node buyer-node/index.js &
          sleep 4
          curl -sf http://localhost:3003/health | grep -q "healthy"
          echo "ONDC Buyer OK"
          pkill -f "buyer-node" || true

  # ──────────────────────────────────────────
  # LAYER 03 · Blockchain (Fabric + Polygon)
  # ──────────────────────────────────────────
  test-blockchain:
    name: "L03 · Blockchain (Chaincode + Solidity)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate Hyperledger chaincode methods
        working-directory: layer-03-blockchain/chaincode/surplus-food
        run: |
          npm install
          node -e "
            const SurplusFoodContract = require('./index.js');
            const c = new SurplusFoodContract();
            const required = ['CreateLot','ReserveLot','ConfirmPickup','ConfirmDelivery','GetLot'];
            required.forEach(m => {
              if (typeof c[m] !== 'function') throw new Error('Missing: ' + m);
              console.log(' checked', m);
            });
            console.log('All chaincode methods present');
          "

      - name: Install Hardhat
        working-directory: layer-03-blockchain/polygon/contracts
        run: npm install --save-dev hardhat @nomicfoundation/hardhat-toolbox

      - name: Compile Solidity contracts
        working-directory: layer-03-blockchain/polygon/contracts
        run: |
          npx hardhat compile
          echo "Solidity compile success"

      - name: Validate ABI artifacts
        working-directory: layer-03-blockchain/polygon/contracts
        run: |
          node -e "
            const fs = require('fs');
            const artifactPath = 'artifacts/contracts/AnnaSetu.sol/AnnaSetu.json';
            if (!fs.existsSync(artifactPath)) {
              console.log('Artifact path:', artifactPath, '— checking alternatives');
              const walk = (dir) => fs.readdirSync(dir).flatMap(f => {
                const p = dir+'/'+f;
                return fs.statSync(p).isDirectory() ? walk(p) : [p];
              });
              const jsons = walk('artifacts').filter(f => f.endsWith('.json') && !f.includes('dbg'));
              console.log('Found artifacts:', jsons);
              process.exit(0);
            }
            const artifact = JSON.parse(fs.readFileSync(artifactPath));
            const fns = artifact.abi.filter(x => x.type==='function').map(x => x.name);
            ['recordDonation','issueFoodCredit','recordRedemption','getImpactMetrics'].forEach(fn => {
              if (!fns.includes(fn)) throw new Error('Missing ABI function: ' + fn);
              console.log(' checked', fn);
            });
            console.log('ABI validation passed. Contract:', artifact.contractName);
          "

  # ──────────────────────────────────────────
  # LAYER 04 · Identity Service (Python)
  # ──────────────────────────────────────────
  test-identity:
    name: "L04 · Identity Service (Python/FastAPI)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: layer-04-identity/kyc-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Start service
        run: uvicorn main:app --host 0.0.0.0 --port 8001 &
      - name: Wait for startup
        run: sleep 5
      - name: Health check
        run: |
          curl -sf http://localhost:8001/health | python3 -c "
          import sys, json; d=json.load(sys.stdin)
          assert d['status']=='healthy'; print('Health OK')
          "
      - name: Test OTP send
        run: |
          curl -sf -X POST http://localhost:8001/api/v1/kyc/send-otp \
            -H "Content-Type: application/json" \
            -d '{"aadhaar_number":"123456789012","mobile_last4":"0000"}' \
          | python3 -c "
          import sys,json; d=json.load(sys.stdin)
          assert d['success']==True and 'session_id' in d
          print('OTP send OK:', d['session_id'][:8])
          "
      - name: Test OTP verify flow
        run: |
          SESSION=$(curl -sf -X POST http://localhost:8001/api/v1/kyc/send-otp \
            -H "Content-Type: application/json" \
            -d '{"aadhaar_number":"123456789012","mobile_last4":"0000"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['session_id'])")
          curl -sf -X POST http://localhost:8001/api/v1/kyc/verify-otp \
            -H "Content-Type: application/json" \
            -d "{\"aadhaar_number\":\"123456789012\",\"otp\":\"123456\",\"session_id\":\"$SESSION\"}" \
          | python3 -c "
          import sys,json; d=json.load(sys.stdin)
          assert d['success']==True and 'kyc_token' in d
          print('OTP verify OK')
          "
      - name: Test NFSA lookup
        run: |
          curl -sf -X POST http://localhost:8001/api/v1/nfsa/lookup \
            -H "Content-Type: application/json" \
            -d '{"ration_card_no":"GJ-PHH-001","state":"Gujarat"}' \
          | python3 -c "
          import sys,json; d=json.load(sys.stdin)
          assert d['success']==True; print('NFSA OK:', d['nfsa_data']['category'])
          "

  # ──────────────────────────────────────────
  # LAYER 05 · e-RUPI Finance Service
  # ──────────────────────────────────────────
  test-erupi:
    name: "L05 · e-RUPI Finance Service (Node.js)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: layer-05-finance/erupi-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install
      - name: Start service
        run: node server.js &
      - name: Wait for startup
        run: sleep 4
      - name: Health check
        run: curl -sf http://localhost:3005/health | grep -q "healthy" && echo "Health OK"
      - name: Test PHH voucher issuance (Rs.1000)
        run: |
          RESP=$(curl -sf -X POST http://localhost:3005/api/v1/vouchers/issue \
            -H "Content-Type: application/json" \
            -d '{"beneficiaryId":"BEN-CI-001","mobile":"9999999999","nfsaCategory":"PHH","districtCode":"GJ020"}')
          echo "$RESP" | node -e "
          const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
          if(!d.success||d.amountINR!==1000) throw new Error('PHH issue failed: '+JSON.stringify(d));
          console.log('PHH voucher OK:', d.voucherId, 'Rs.' + d.amountINR);
          "
      - name: Test AAY voucher issuance (Rs.1500)
        run: |
          RESP=$(curl -sf -X POST http://localhost:3005/api/v1/vouchers/issue \
            -H "Content-Type: application/json" \
            -d '{"beneficiaryId":"BEN-CI-002","mobile":"8888888888","nfsaCategory":"AAY","districtCode":"GJ020"}')
          echo "$RESP" | node -e "
          const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
          if(d.amountINR!==1500) throw new Error('AAY amount wrong: '+d.amountINR);
          console.log('AAY voucher OK:', d.voucherId, 'Rs.' + d.amountINR);
          "
      - name: Test redemption + balance check
        run: |
          VID=$(curl -sf -X POST http://localhost:3005/api/v1/vouchers/issue \
            -H "Content-Type: application/json" \
            -d '{"beneficiaryId":"BEN-CI-003","mobile":"7777777777","nfsaCategory":"PHH"}' \
            | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).voucherId)")
          curl -sf -X POST http://localhost:3005/api/v1/vouchers/redeem \
            -H "Content-Type: application/json" \
            -d "{\"voucherId\":\"$VID\",\"merchantId\":\"KIRANA-001\",\"merchantUPI\":\"k@upi\",\"amountINR\":350}" \
          | node -e "
          const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
          if(!d.success||d.remainingBalance!==650) throw new Error('Redeem failed: '+JSON.stringify(d));
          console.log('Redemption OK. Balance: Rs.' + d.remainingBalance);
          "
      - name: Test over-balance rejection (expect 400)
        run: |
          VID=$(curl -sf -X POST http://localhost:3005/api/v1/vouchers/issue \
            -H "Content-Type: application/json" \
            -d '{"beneficiaryId":"BEN-CI-004","mobile":"6666666666","nfsaCategory":"PHH"}' \
            | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).voucherId)")
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3005/api/v1/vouchers/redeem \
            -H "Content-Type: application/json" \
            -d "{\"voucherId\":\"$VID\",\"merchantId\":\"K\",\"merchantUPI\":\"k@upi\",\"amountINR\":9999}")
          [ "$CODE" = "400" ] && echo "Over-balance rejected correctly (400)" || (echo "Expected 400 got $CODE" && exit 1)

  # ──────────────────────────────────────────
  # LAYER 06 · Beneficiary Portal (React 18)
  # ──────────────────────────────────────────
  build-portal:
    name: "L06 · Beneficiary Portal (React 18)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: layer-06-beneficiary/web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install
      - name: Validate React components
        run: |
          for f in src/App.jsx src/pages/Dashboard.jsx src/pages/Vouchers.jsx \
                    src/pages/KiranaPOS.jsx src/pages/Onboarding.jsx src/pages/NearbyStores.jsx \
                    src/main.jsx index.html vite.config.js; do
            [ -f "$f" ] && echo "  checked $f" || (echo "MISSING: $f" && exit 1)
          done
      - name: Production build
        run: npm run build
        env:
          VITE_ERUPI_API: http://localhost:3005
          VITE_KYC_API: http://localhost:8001

  # ──────────────────────────────────────────
  # INTEGRATION GATE
  # ──────────────────────────────────────────
  integration-check:
    name: "All Layers · Integration Gate"
    runs-on: ubuntu-latest
    needs: [test-donor-api, test-ondc, test-blockchain, test-identity, test-erupi, build-portal]
    steps:
      - name: All layers green
        run: |
          echo ""
          echo "  ╔══════════════════════════════════════════════╗"
          echo "  ║   AnnaSetu CI — All 6 Layers Passed ✅       ║"
          echo "  ╠══════════════════════════════════════════════╣"
          echo "  ║  L01  Donor API           Node.js/Express   ║"
          echo "  ║  L02  ONDC Beckn Nodes    Beckn Protocol    ║"
          echo "  ║  L03  Blockchain          Fabric + Polygon  ║"
          echo "  ║  L04  Identity Service    Python/FastAPI    ║"
          echo "  ║  L05  e-RUPI Finance      Node.js           ║"
          echo "  ║  L06  Beneficiary Portal  React 18          ║"
          echo "  ╠══════════════════════════════════════════════╣"
          echo "  ║   India's Digital Food Bridge is ready 🌾    ║"
          echo "  ╚══════════════════════════════════════════════╝"
