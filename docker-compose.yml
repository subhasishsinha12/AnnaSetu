version: '3.9'

services:
  # ── Infrastructure ──
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: annasetu
      POSTGRES_USER: annasetu
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annasetu"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  # ── Layer 01: Donor API ──
  donor-api:
    build: ./layer-01-donor
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      DONOR_API_PORT: 3001
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      ONDC_SELLER_URL: http://ondc-seller:3002
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./layer-01-donor:/app
      - /app/node_modules

  # ── Layer 02: ONDC Nodes ──
  ondc-seller:
    build: ./layer-02-ondc
    command: node seller-node/index.js
    ports:
      - "3002:3002"
    environment:
      ONDC_SELLER_PORT: 3002
      ONDC_BUYER_URL: http://ondc-buyer:3003

  ondc-buyer:
    build: ./layer-02-ondc
    command: node buyer-node/index.js
    ports:
      - "3003:3003"
    environment:
      ONDC_BUYER_PORT: 3003
      ONDC_SELLER_URL: http://ondc-seller:3002

  # ── Layer 04: Identity Service ──
  identity-service:
    build: ./layer-04-identity/kyc-service
    ports:
      - "8001:8001"
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    environment:
      POSTGRES_HOST: postgres

  # ── Layer 05: e-RUPI Service ──
  erupi-service:
    build: ./layer-05-finance/erupi-service
    ports:
      - "3005:3005"
    environment:
      ERUPI_PORT: 3005
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis

  # ── Layer 06: Beneficiary Portal ──
  beneficiary-portal:
    build: ./layer-06-beneficiary/web-app
    ports:
      - "3000:3000"
    environment:
      VITE_ERUPI_API: http://localhost:3005
      VITE_KYC_API: http://localhost:8001
    depends_on:
      - erupi-service
      - identity-service

volumes:
  postgres_data:
